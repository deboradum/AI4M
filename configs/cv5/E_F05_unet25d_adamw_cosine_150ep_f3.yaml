# 5-fold CV, fold 3 (data/SEGTHOR_FULL_huwide_resampled_cv3 = configs/splits/segthor_full_cv5_f3.json).
# Identical to configs/full/E_F05_unet25d_adamw_cosine_150ep.yaml except dataset, run name and PNG interval;
# scored on lastweights.pt (final epoch), not bestweights.pt. Generated by scripts/run_cv5.sh --make-configs.
# Final 2.5D run on E_F04's recipe.  Changes vs E_F04: three-slice input
# [z-1, z, z+1]; AdamW with explicit weight decay 1e-4 and cosine decay of
# the learning rate to 0 over 150 epochs.  Early stopping is off because the
# schedule only reaches its low learning rates at the end; the checkpoint is
# still chosen by best validation Dice.  num_workers 8: the loader fix makes
# workers safe on Snellius and 2.5D reads three PNGs per sample.  Data: HU
# window [-1000, 1000] and resampling to 1.0/1.0/2.5 mm (E_F01 + E_F03).
dataset: "SEGTHOR_FULL_huwide_resampled_cv3"
mode: "full"
loss_fn: "ce_dice"
K: 5
net_name: "UNet"
B: 8
kernels: 32
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 150
num_workers: 8
temperature: 1.0
optimizer: "AdamW"
weight_decay: 0.0001
lr_scheduler: "cosine"
lr_min: 0.0
seed: 123
patience: -1
in_slices: 3
augment: true
aug_rotation: 15.0
aug_scale_min: 0.9
aug_scale_max: 1.1
aug_intensity: 0.1
aug_elastic_alpha: 0.0
aug_elastic_sigma: 4.0
wandb_enabled: true
wandb_project: "AI4M"
wandb_run_name: "E_F05_unet25d_adamw_cosine_150ep_f3"
wandb_tags: ["full_dataset", "huwide", "resampled", "unet", "ce_dice", "augmentation", "2.5d", "adamw", "cosine"]
save_val_png_every: 0
