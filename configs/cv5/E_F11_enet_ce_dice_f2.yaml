# 5-fold CV, fold 2 (data/SEGTHOR_FULL_huwide_resampled_cv2 = configs/splits/segthor_full_cv5_f2.json).
# Identical to configs/full/E_F11_enet_ce_dice.yaml except dataset, run name, cv5/fold tags and PNG interval;
# scored on lastweights.pt (final epoch), not bestweights.pt. Generated by scripts/run_cv5.sh --make-configs.
# E_F11: the ENet of E_F00 on the same data and loss as the U-Nets (HU window + resampling, CE+Dice),
# so that ENet vs E_F06 (2D U-Net) differs by architecture, optimizer/schedule and augmentation, not data or loss.
# Everything else as E_F00: Adam, lr 5e-4, no scheduler, no augmentation, 100 epochs.
dataset: "SEGTHOR_FULL_huwide_resampled_cv2"
mode: "full"
loss_fn: "ce_dice"
K: 5
net_name: "ENet"
B: 8
kernels: 8
factor: 2
lr: 0.0005
betas: [0.9, 0.999]
epochs: 100
num_workers: 5
temperature: 1.0
optimizer: "Adam"
seed: 123
patience: -1  # -1 for disabling
save_val_png_every: 0
