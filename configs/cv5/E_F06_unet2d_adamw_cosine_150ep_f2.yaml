# 5-fold CV, fold 2 (data/SEGTHOR_FULL_huwide_resampled_cv2 = configs/splits/segthor_full_cv5_f2.json).
# Identical to configs/full/E_F06_unet2d_adamw_cosine_150ep.yaml except dataset, run name and PNG interval;
# scored on lastweights.pt (final epoch), not bestweights.pt. Generated by scripts/run_cv5.sh --make-configs.
# 2D sibling of E_F05: identical recipe with single-slice input, so E_F05 vs
# E_F06 isolates 2.5D.  Data: HU window [-1000, 1000] and resampling to
# 1.0/1.0/2.5 mm (E_F01 + E_F03), so E_F06 vs E_F04 is not a clean optimizer test.
dataset: "SEGTHOR_FULL_huwide_resampled_cv2"
mode: "full"
loss_fn: "ce_dice"
K: 5
net_name: "UNet"
B: 8
kernels: 32
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 150
num_workers: 8
temperature: 1.0
optimizer: "AdamW"
weight_decay: 0.0001
lr_scheduler: "cosine"
lr_min: 0.0
seed: 123
patience: -1
in_slices: 1
augment: true
aug_rotation: 15.0
aug_scale_min: 0.9
aug_scale_max: 1.1
aug_intensity: 0.1
aug_elastic_alpha: 0.0
aug_elastic_sigma: 4.0
wandb_enabled: true
wandb_project: "AI4M"
wandb_run_name: "E_F06_unet2d_adamw_cosine_150ep_f2"
wandb_tags: ["full_dataset", "huwide", "resampled", "unet", "ce_dice", "augmentation", "2d", "adamw", "cosine"]
save_val_png_every: 0
