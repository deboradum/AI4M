# E010_unet2d: isolated architecture/capacity ablation of E001.
# For UNet, kernels is the base channel width and factor is the number of
# encoder/decoder levels. All non-model settings match E001 exactly.
dataset: "SEGTHOR"
mode: "full"
K: 5
net_name: "UNet"
B: 8
kernels: 32
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 25
num_workers: 5
temperature: 1.0
optimizer: "Adam"
seed: 123
patience: -1
in_slices: 1
