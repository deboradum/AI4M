# Full-dataset transfer of E024's U-Net recipe.  E_F01's HU-wide data and
# split are fixed; the changes are U-Net, CE+Dice, safe augmentation, and a
# longer training budget with validation-Dice early stopping.
dataset: "SEGTHOR_FULL_huwide"
mode: "full"
loss_fn: "ce_dice"
K: 5
net_name: "UNet"
B: 8
kernels: 32
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 150
num_workers: 0
temperature: 1.0
optimizer: "Adam"
seed: 123
patience: 20
in_slices: 1
augment: true
aug_rotation: 15.0
aug_scale_min: 0.9
aug_scale_max: 1.1
aug_intensity: 0.1
aug_elastic_alpha: 0.0
aug_elastic_sigma: 4.0
wandb_enabled: true
wandb_project: "AI4M"
wandb_run_name: "E_F04_unet_ce_dice_augment_150ep_es20"
wandb_tags: ["full_dataset", "huwide", "unet", "ce_dice", "augmentation"]
