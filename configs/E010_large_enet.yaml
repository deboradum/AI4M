# E010_large_enet: isolated model-capacity ablation of E001.
# Only ENet capacity differs from E001; retain the one-slice input and every
# data, optimization, and evaluation setting of the reproducible baseline.
dataset: "SEGTHOR"
mode: "full"
K: 5
net_name: "ENet"
B: 8
kernels: 16
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 25
num_workers: 5
temperature: 1.0
optimizer: "Adam"
seed: 123
patience: -1
in_slices: 1
