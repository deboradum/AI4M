# E024_unet_aorta_ce_dice_augment_75ep: exact E022 training protocol with the
# model replaced by the E010 plain 2D U-Net. This is the controlled U-Net vs
# ENet capacity comparison on the recovered four-organ dataset.
dataset: "SEGTHOR_aorta_huwide"
mode: "full"
loss_fn: "ce_dice"
K: 5
net_name: "UNet"
B: 8
kernels: 32
factor: 4
lr: 0.0005
betas: [0.9, 0.999]
epochs: 75
num_workers: 0
temperature: 1.0
optimizer: "Adam"
seed: 123
patience: -1
in_slices: 1
augment: true
aug_rotation: 15.0
aug_scale_min: 0.9
aug_scale_max: 1.1
aug_intensity: 0.1
aug_elastic_alpha: 0.0
aug_elastic_sigma: 4.0
